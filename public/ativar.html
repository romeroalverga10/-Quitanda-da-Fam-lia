<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ativação — PDV Quitanda</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #C4614E 0%, #E8816D 50%, #388e3c 100%);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,.25);
    }
    .logo { text-align: center; margin-bottom: 28px; }
    .logo .icone { font-size: 52px; }
    .logo h1 { font-size: 22px; color: #E8816D; margin-top: 8px; }
    .logo p { font-size: 13px; color: #888; margin-top: 4px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #555; margin-bottom: 5px; margin-top: 16px; }
    input {
      width: 100%; padding: 12px 14px; border: 2px solid #e0e0e0;
      border-radius: 8px; font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    input:focus { border-color: #E8816D; }
    input.erro { border-color: #D4705C; }
    .hint { font-size: 12px; color: #aaa; margin-top: 4px; }
    .btn {
      width: 100%; margin-top: 24px; padding: 14px;
      background: #E8816D; color: #fff; border: none;
      border-radius: 10px; font-size: 16px; font-weight: bold;
      cursor: pointer; transition: background .2s;
    }
    .btn:hover { background: #C4614E; }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 16px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.erro    { background: #ffebee; color: #D4705C; border: 1px solid #ffcdd2; display: block; }
    .msg.sucesso { background: #e8f5e9; color: #E8816D; border: 1px solid #c8e6c9; display: block; }
    .msg.aviso   { background: #fff3e0; color: #e65100; border: 1px solid #ffe0b2; display: block; }
    .rodape { text-align: center; margin-top: 20px; font-size: 12px; color: #aaa; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff;
      border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Estado: licença ativa mostra painel de info */
    .painel-ativo { display: none; text-align: center; }
    .painel-ativo .check { font-size: 56px; }
    .painel-ativo h2 { color: #E8816D; margin: 8px 0 4px; }
    .painel-ativo p { color: #666; font-size: 14px; }
    .info-box { background: #f5f5f5; border-radius: 8px; padding: 14px; margin: 16px 0; text-align: left; }
    .info-linha { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
    .info-linha span:first-child { color: #888; }
    .info-linha span:last-child { font-weight: bold; }
    .btn-outline { background: #fff; color: #E8816D; border: 2px solid #E8816D; }
    .btn-outline:hover { background: #e8f5e9; }
  </style>
</head>
<body>
<div class="card">

  <!-- Formulário de ativação -->
  <div id="formAtivacao">
    <div class="logo">
      <div class="icone">🛒</div>
      <h1>PDV Quitanda</h1>
      <p>Ative sua licença para começar a usar o sistema</p>
    </div>

    <label>CNPJ da empresa</label>
    <input type="text" id="cnpj" placeholder="00.000.000/0000-00" maxlength="18" oninput="mascararCNPJ(this)">

    <label>Chave de licença</label>
    <input type="text" id="chave" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19"
      style="letter-spacing:2px;font-family:monospace;font-size:17px" oninput="mascararChave(this)">
    <div class="hint">Você recebeu essa chave por e-mail ou WhatsApp ao contratar.</div>

    <div id="msg" class="msg"></div>

    <button class="btn" id="btnAtivar" onclick="ativar()">Ativar Sistema</button>

    <div class="rodape">
      Problemas? WhatsApp: <strong>(11) 99999-9999</strong><br>
      <a href="/login.html" style="color:#aaa;font-size:11px">Já ativado? Entrar no sistema</a>
    </div>
  </div>

  <!-- Painel quando já está ativo -->
  <div class="painel-ativo" id="painelAtivo">
    <div class="check">✅</div>
    <h2>Sistema Ativado!</h2>
    <p>Sua licença está válida e o sistema está pronto para uso.</p>
    <div class="info-box" id="infoLicenca"></div>
    <button class="btn" onclick="location.href='/login.html'">Entrar no Sistema →</button>
    <button class="btn btn-outline" onclick="mostrarFormAtivacao()" style="margin-top:8px">Trocar licença</button>
  </div>

</div>

<script>
async function checarStatus() {
  try {
    const res = await fetch('/api/licenca/status').then(r => r.json());
    if (res.ok) mostrarAtivo(res);
  } catch {}
}

function mostrarAtivo(res) {
  document.getElementById('formAtivacao').style.display = 'none';
  document.getElementById('painelAtivo').style.display = 'block';

  const validade = res.validade
    ? new Date(res.validade + 'T00:00:00').toLocaleDateString('pt-BR')
    : '—';
  const cnpjFmt = (res.cnpj || '').replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');

  document.getElementById('infoLicenca').innerHTML = `
    <div class="info-linha"><span>CNPJ</span><span>${cnpjFmt || '—'}</span></div>
    <div class="info-linha"><span>Válida até</span><span>${validade}</span></div>
    <div class="info-linha"><span>Plano</span><span>${res.plano || 'Completo'}</span></div>
    ${res.aviso ? `<div style="margin-top:8px;font-size:12px;color:#e65100">⚠️ ${res.aviso}</div>` : ''}
  `;
}

function mostrarFormAtivacao() {
  document.getElementById('formAtivacao').style.display = 'block';
  document.getElementById('painelAtivo').style.display = 'none';
}

async function ativar() {
  const cnpj = document.getElementById('cnpj').value.replace(/\D/g, '');
  const chave = document.getElementById('chave').value.replace(/\s/g, '');
  const msg = document.getElementById('msg');
  const btn = document.getElementById('btnAtivar');

  msg.className = 'msg';
  msg.style.display = 'none';

  if (cnpj.length !== 14) {
    msg.className = 'msg erro'; msg.textContent = 'Informe o CNPJ completo (14 dígitos).'; return;
  }
  if (chave.length < 16) {
    msg.className = 'msg erro'; msg.textContent = 'Informe a chave de licença completa.'; return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Verificando...';

  try {
    const res = await fetch('/api/licenca/ativar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chave, cnpj }),
    }).then(r => r.json());

    if (res.ok) {
      msg.className = 'msg sucesso';
      msg.textContent = '✓ Licença ativada com sucesso! Redirecionando...';
      setTimeout(() => location.href = '/login.html', 1500);
    } else {
      const erros = {
        chave_invalida: 'Chave de licença inválida ou não encontrada.',
        cnpj_incorreto: 'CNPJ não corresponde a esta chave de licença.',
        expirado: 'Esta licença está vencida. Entre em contato para renovar.',
        revogado: 'Esta licença foi cancelada. Entre em contato.',
        ja_ativado: 'Esta licença já está ativa em outro computador.',
        offline: 'Não foi possível conectar ao servidor. Verifique a internet.',
      };
      msg.className = 'msg erro';
      msg.textContent = erros[res.motivo] || ('Erro: ' + (res.motivo || 'falha na ativação'));
      btn.disabled = false;
      btn.textContent = 'Ativar Sistema';
    }
  } catch {
    msg.className = 'msg aviso';
    msg.textContent = 'Sem conexão com o servidor de licenças. Verifique a internet.';
    btn.disabled = false;
    btn.textContent = 'Ativar Sistema';
  }
}

function mascararCNPJ(el) {
  let v = el.value.replace(/\D/g, '').slice(0, 14);
  v = v.replace(/^(\d{2})(\d)/, '$1.$2');
  v = v.replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3');
  v = v.replace(/\.(\d{3})(\d)/, '.$1/$2');
  v = v.replace(/(\d{4})(\d)/, '$1-$2');
  el.value = v;
}

function mascararChave(el) {
  let v = el.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 16);
  v = v.match(/.{1,4}/g)?.join('-') || v;
  el.value = v;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') ativar();
});

checarStatus();
</script>
</body>
</html>
